name: Build DZ Cast APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-unzip DZCast_Project.zip if present
        run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d _extracted_tmp
              if [ -f "_extracted_tmp/app/build.gradle.kts" ]; then
                cp -rf _extracted_tmp/* .
                cp -rf _extracted_tmp/.github . 2>/dev/null || true
              else
                SUBDIR=$(find _extracted_tmp -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
                if [ -n "$SUBDIR" ]; then
                  cp -rf "$SUBDIR"/* .
                  cp -rf "$SUBDIR"/.github . 2>/dev/null || true
                fi
              fi
              rm -rf _extracted_tmp
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version
